<text x="30" y="102" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Send files screen-to-camera with animated QR codes and fountain coding. No pairing, no network.</text>
