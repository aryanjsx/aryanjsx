<svg xmlns="http://www.w3.org/2000/svg" width="900" height="124" viewBox="0 0 900 124" fill="none">
<rect x="0.5" y="0.5" width="899" height="123" rx="14" fill="#0b0f17" stroke="#1f2633"/>
<defs>
  <linearGradient id="sh" x1="0" x2="1">
    <stop offset="0" stop-color="#bc8cff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#bc8cff"/>
    <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="899" height="123" rx="14"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect x="0" y="0" width="4" height="124" fill="#bc8cff"/>
  <rect y="0" width="220" height="2" fill="url(#sh)">
    <animate attributeName="x" values="-220;900" dur="3.6s" begin="2.0999999999999996s" repeatCount="indefinite"/>
  </rect>
</g>
<text x="30" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.5"><tspan fill="#bc8cff">03</tspan><tspan fill="#484f58">  /  </tspan><tspan fill="#8b949e">AI CODING ENVIRONMENT</tspan></text>
<text x="30" y="74" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#e6edf3">Openclaude</text>
<text x="30" y="102" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">A Claude-style coding workspace with an OpenAI-compatible shim, so any LLM provider plugs in.</text>
<rect x="825.8" y="22" width="44.2" height="24" rx="12" fill="#0f1520" stroke="#1f2633"/><text x="847.9" y="38.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">llm</text>
<rect x="721.8" y="22" width="96.0" height="24" rx="12" fill="#0f1520" stroke="#1f2633"/><text x="769.8" y="38.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e">typescript</text>
<g><text x="870" y="80" text-anchor="end" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#bc8cff">→</text><animateTransform attributeName="transform" type="translate" values="0 0;6 0;0 0" dur="1.6s" repeatCount="indefinite"/></g>
